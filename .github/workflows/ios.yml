name: iOS build

# Verifies the iOS app still compiles after web or native changes. Build-only:
# no code signing, no device/simulator run, no upload — just a fast "does Xcode
# still accept the project" gate, since the iOS target has no other CI coverage.
#
# Runs on macOS (Xcode is macOS-only). Scoped to changes that can affect the
# iOS build so ordinary web-only PRs don't spend a macOS runner. First run may
# need the scheme name or Xcode version below nudged to match the CI image.

on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.js'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.js'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    # macos-15 for Xcode 16+; the project is objectVersion 70, which older Xcode
    # (e.g. 15.4 on macos-14) refuses to open ("future Xcode project file format").
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22 (npx cap sync fails on 20).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache Swift packages so a run doesn't re-download them. Without this
      # every run fetches the package sources and the Capacitor / RevenueCat
      # binary frameworks from GitHub releases, and an outage there fails the
      # build at "Resolve Package Graph". The cloned sources live in a fixed
      # directory (passed to xcodebuild below) so they can be cached; SwiftPM
      # keeps downloaded binary artifacts in ~/Library/Caches/org.swift.swiftpm.
      # Keyed before cap sync rewrites CapApp-SPM/Package.swift, on the
      # committed manifests plus package-lock.json, which pins the Capacitor
      # plugin versions those manifests resolve to. actions/cache only saves
      # after a successful job, so a half-finished download is never cached.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/App/CapApp-SPM/Package.swift', 'ios/App/Packages/**/Package.swift', 'package-lock.json') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # The developer path: web build, cap sync, the SPM platform pin, and
      # scripts/sync-ios-version.mjs, which writes ios/version.generated.xcconfig
      # (both xcconfigs include it, so the build fails without it). IOS_BUILD
      # only needs to be a valid build number here, since nothing is uploaded.
      - name: Build web assets and sync Capacitor iOS
        run: npm run build:ios
        env:
          IOS_BUILD: ${{ github.run_number }}

      - name: Build iOS app (no signing)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
