name: Android build

# Verifies the Android app still compiles after web or native changes — the
# Android twin of ios.yml. Build-only: assembleDebug, no signing, no emulator,
# no upload. The Kotlin/Java in android/ had no compile coverage at all before
# this; a broken plugin or widget could only surface on someone's machine.
#
# Scoped to changes that can affect the Android build so ordinary web-only PRs
# don't spend the (cheap, but not free) gradle run.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.js'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # AGP 8.13 / Gradle 9.3 build fine on 21; 17 is the floor.
          distribution: temurin
          java-version: 21
          # Cache ~/.gradle/caches and ~/.gradle/wrapper (the Gradle
          # distribution, the Kotlin compiler and every dependency), keyed on
          # the Gradle files. Without it each run downloads all of that from
          # services.gradle.org, Maven Central and GitHub releases, and an
          # outage on any of them fails the build before any code compiles.
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Fetch the Gradle distribution on its own, with retries, before the
      # build. On a cold cache the wrapper downloads it from services.gradle.org,
      # which redirects to GitHub release assets; those intermittently answer
      # 504, and a single failure used to fail the whole job. Retrying only this
      # step means a genuine build failure below is never run three times.
      # `--version` downloads and unpacks the distribution and does nothing else.
      - name: Fetch Gradle distribution (with retries)
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle download failed (attempt $attempt of 3), retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Gradle download failed 3 times"
          exit 1

      - name: Build Android app (debug, no signing)
        run: cd android && ./gradlew assembleDebug --no-daemon
